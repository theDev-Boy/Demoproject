name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch: # Allows you to manually trigger the build from the Actions tab

jobs:
  build:
    name: Build & Export APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17' # Required for newer Android Gradle Plugins

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true # Speeds up consecutive builds by caching flutter SDK

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android APK
        continue-on-error: true # Ignores Flutter's fake "failed to find APK" error
        env:
          JAVA_OPTS: "-Xmx4g"
          GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8'"
        run: flutter build apk --release --no-tree-shake-icons --no-pub

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zuumeet-Release-APK
          # Use a wildcard to find the APK wherever Gradle hid it
          path: build/**/outputs/**/*.apk
          retention-days: 14 # The APK will be available for download for 14 days
